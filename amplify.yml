version: 1
frontend:
  phases:
    build:
      commands:
        - echo "Static site — no build step required"
  artifacts:
    baseDirectory: .
    files:
      - 'index.html'
      - 'styles.css'
      - 'script.js'
      - 'propuesta/**/*'
      - 'bio/**/*'
      - 'documentos/**/*'
      - 'libro/**/*'
      - 'contacto/**/*'
      - 'apoyar/**/*'
      - 'assets/hero-*.jpg'
      - 'assets/alvar-photo-optimized.jpg'
      - 'assets/libro-portada.png'
      - 'assets/*.pdf'
  cache:
    paths: []
